name: crediplus

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crediplus
      POSTGRES_PASSWORD: crediplus_dev_only
      POSTGRES_DB: crediplus
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crediplus -d crediplus']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crediplus

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crediplus

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crediplus_minio
      MINIO_ROOT_PASSWORD: crediplus_minio_dev_only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crediplus

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 crediplus_minio crediplus_minio_dev_only;
      mc mb --ignore-existing local/crediplus-dev;
      mc anonymous set none local/crediplus-dev;
      exit 0;
      "
    networks:
      - crediplus

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - crediplus

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  crediplus:
    driver: bridge
